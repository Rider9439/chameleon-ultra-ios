name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build IPA (unsigned)
    runs-on: macos-14
    env:
      HAS_SIGNING: ${{ secrets.P12_BASE64 != '' && secrets.PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          ls /Applications | grep -i xcode || true
          xcode-select -p
          xcodebuild -version

      # 1) 核心算法测试（同一 runner，节省 macOS 额度）
      - name: Compile & run core algorithm tests
        run: |

          swiftc \
            ChameleonUltra/Core/ChameleonFrame.swift \
            ChameleonUltra/Core/Crypto1.swift \
            ChameleonUltra/Core/LfsrRecovery.swift \
            ChameleonUltra/Core/KeyRecovery.swift \
            ChameleonUltra/Core/MfClassic.swift \
            ChameleonUltra/Core/KeysFile.swift \
            ChameleonUltraTests/CoreAlgorithmTests.swift \
            -o core_tests
          ./core_tests

      # 2) 构建未签名 archive
      - name: Build unsigned archive
        run: |

          xcodebuild \
            -project ChameleonUltra.xcodeproj \
            -scheme ChameleonUltra \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # 3) 打包未签名 IPA
      - name: Package unsigned IPA
        run: |

          APP=build/Build/Products/Release-iphoneos/ChameleonUltra.app
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r ChameleonUltra-unsigned.ipa Payload

      # 4) 上传 IPA
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChameleonUltra-ipa
          path: ChameleonUltra-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

      # 5) 上传 .app bundle（调试用）
      - name: Upload .app bundle (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: ChameleonUltra-app
          path: build/Build/Products/Release-iphoneos/ChameleonUltra.app
          if-no-files-found: ignore
